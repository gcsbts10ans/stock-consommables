<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E5FAD">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stock petits consommables — Maquette</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#1E5FAD;--bleu-cl:#E8F0FA;--vert:#16a34a;--vert-cl:#E7F6EC;--rouge:#DC2626;--rouge-cl:#FDECEC;
  --orange:#D97706;--orange-cl:#FEF3E2;--fond:#F4F6FA;--carte:#FFFFFF;--txt:#1A2332;--muted:#6B7280;--bord:#E6EAF0;
  --ombre:0 1px 2px rgba(26,35,50,.04),0 4px 14px rgba(26,35,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--fond);}
body{font-family:'DM Sans',Arial,sans-serif;color:var(--txt);font-size:16px;padding-bottom:24px;}
button{font-family:inherit;cursor:pointer;}
svg{display:block;}

.maq{background:var(--orange-cl);color:#92400E;font-size:12px;text-align:center;padding:4px;font-weight:500;}

/* En-tête */
header{background:var(--carte);padding:14px 16px 12px;border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:5;}
.hd{display:flex;align-items:center;}
.hd>*{margin-right:12px;}
.hd>*:last-child{margin-right:0;}
.logo{width:40px;height:40px;border-radius:12px;background:var(--bleu);display:flex;align-items:center;justify-content:center;flex:none;}
.hd .t{flex:1;min-width:0;}
.hd h1{font-size:18px;font-weight:700;line-height:1.2;}
.hd .s{font-size:13px;color:var(--muted);}
.conn i{margin-right:6px;}
.conn{display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--vert);background:var(--vert-cl);padding:6px 10px;border-radius:20px;}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--vert);display:inline-block;}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--bord);background:#fff;display:none;align-items:center;justify-content:center;flex:none;}


/* Actions */
.actions{display:flex;padding:14px 16px 12px;}
.actions>*+*,.row>*+*{margin-left:10px;}
.btn{flex:1;border:none;border-radius:14px;font-size:15px;font-weight:600;padding:14px 12px;display:flex;align-items:center;justify-content:center;}
.btn svg{margin-right:8px;}
.btn-bleu{background:var(--bleu);color:#fff;box-shadow:0 4px 12px rgba(30,95,173,.25);}
.btn-gris{background:var(--carte);color:var(--txt);box-shadow:var(--ombre);}
.btn:active{transform:scale(.98);}


/* Liste */
.liste{padding:0 16px;}
.art{background:var(--carte);border-radius:16px;padding:12px 12px 12px 16px;margin-bottom:10px;display:flex;align-items:center;box-shadow:var(--ombre);border-left:4px solid transparent;}
.art.bas{border-left-color:var(--rouge);}
.art .info{flex:1;min-width:0;}
.art .nom{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jauge{height:6px;border-radius:3px;background:#EEF1F5;margin:8px 0 4px;overflow:hidden;}
.jauge i{display:block;height:100%;border-radius:3px;background:var(--vert);}
.bas .jauge i{background:var(--rouge);}
.art .sub{font-size:12px;color:var(--muted);}
.bas .sub{color:var(--rouge);font-weight:600;}
.stk{font-size:24px;font-weight:700;min-width:44px;text-align:center;}
.bas .stk{color:var(--rouge);}
.art>*+*{margin-left:12px;}
.mvs{display:flex;background:var(--fond);border-radius:14px;padding:4px;}
.mv+.mv{margin-left:4px;}
.mv{width:50px;height:50px;border-radius:11px;border:none;display:flex;align-items:center;justify-content:center;}
.moins{background:var(--rouge-cl);} .plus{background:var(--vert-cl);}
.mv:active{transform:scale(.94);}

/* Feuille modale (bas d'écran) */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,35,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.ov.on{display:flex;}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 24px;width:100%;max-width:600px;animation:monte .2s ease-out;}
@keyframes monte{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--bord);margin:0 auto 14px;}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.tag.s{background:var(--rouge-cl);color:var(--rouge);} .tag.e{background:var(--vert-cl);color:var(--vert);}
.sheet h2{font-size:20px;margin-bottom:2px;}
.sheet p{color:var(--muted);font-size:14px;margin-bottom:18px;}
.qte{display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.qte button{width:64px;height:64px;border-radius:18px;border:none;background:var(--fond);display:flex;align-items:center;justify-content:center;}
.qte span{font-size:44px;font-weight:700;min-width:80px;text-align:center;}
.apres{text-align:center;font-size:14px;color:var(--muted);margin-bottom:16px;}
.apres b{color:var(--txt);}
.qte>*+*{margin-left:20px;}
.row{display:flex;}

/* Inventaire / admin */
.bandeau-info{margin:12px 16px;background:var(--bleu-cl);color:var(--bleu);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;}
.inv .art input,.adm .art input{width:84px;height:50px;font-size:20px;font-weight:600;text-align:center;border:1px solid var(--bord);border-radius:12px;font-family:inherit;color:var(--txt);outline:none;background:var(--fond);}
.inv .art input:focus,.adm .art input:focus{border-color:var(--bleu);background:#fff;}
.ecart{font-size:14px;font-weight:700;min-width:44px;text-align:right;}
.lbl{font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;font-weight:500;}
.suppr{width:44px;height:44px;border-radius:12px;border:none;background:var(--rouge-cl);display:flex;align-items:center;justify-content:center;}

/* Code */
.code i+i{margin-left:14px;}
.code{display:flex;justify-content:center;margin:6px 0 18px;}
.code i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bord);display:block;}
.code i.on{background:var(--bleu);border-color:var(--bleu);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:10px;margin-bottom:14px;}
.pad button{height:60px;font-size:24px;font-weight:600;border:none;border-radius:14px;background:var(--fond);color:var(--txt);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:12px 20px;border-radius:14px;display:none;font-size:15px;font-weight:500;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;}
.vue{display:none;} .vue.on{display:block;}
</style>
</head>
<body>
<div class="maq">MAQUETTE — données fictives, aucun enregistrement</div>

<header>
  <div class="hd">
    <button class="back" id="back" onclick="vue('vStock')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A2332" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="logo" id="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>
    <div class="t"><h1 id="titre">Petits consommables</h1><div class="s" id="stitre">Stock central — zone expédition</div></div>
    <div class="conn"><i></i>En ligne</div>
  </div>
</header>

<!-- STOCK -->
<div class="vue on" id="vStock">
  <div class="actions">
    <button class="btn btn-bleu" onclick="ouvrirInv()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Inventaire</button>
    <button class="btn btn-gris" onclick="ouvrirCode()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A2332" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Administration</button>
  </div>
  <div class="liste" id="liste"></div>
</div>

<!-- INVENTAIRE -->
<div class="vue inv" id="vInv">
  <div class="bandeau-info">Saisis la quantité comptée pour chaque article. Les cases laissées vides gardent le stock actuel.</div>
  <div class="liste" id="listeInv"></div>
  <div class="actions"><button class="btn btn-bleu" onclick="validerInv()">Valider l'inventaire</button></div>
</div>

<!-- ADMIN -->
<div class="vue adm" id="vAdm">
  <div class="actions"><button class="btn btn-bleu" onclick="toast('Ajout d\'article (maquette)')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter un article</button></div>
  <div class="liste" id="listeAdm"></div>
</div>

<!-- FEUILLE MOUVEMENT -->
<div class="ov" id="ovMv" onclick="if(event.target===this)fermer('ovMv')"><div class="sheet">
  <div class="poignee"></div>
  <span class="tag" id="mvTag"></span>
  <h2 id="mvTitre"></h2><p id="mvSous"></p>
  <div class="qte">
    <button onclick="q(-1)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A2332" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <span id="mvQ">1</span>
    <button onclick="q(1)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A2332" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="apres" id="mvApres"></div>
  <div class="row"><button class="btn btn-gris" onclick="fermer('ovMv')">Annuler</button><button class="btn" id="mvOk" style="color:#fff" onclick="validerMv()">Valider</button></div>
</div></div>

<!-- FEUILLE CODE -->
<div class="ov" id="ovCode" onclick="if(event.target===this)fermer('ovCode')"><div class="sheet" style="max-width:420px">
  <div class="poignee"></div>
  <h2 style="text-align:center">Code administration</h2><p style="text-align:center">Maquette : n'importe quel code à 4 chiffres</p>
  <div class="code" id="codeAff"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <button class="btn btn-gris" style="width:100%" onclick="fermer('ovCode')">Annuler</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
var APP_VERSION = "2"; /* aligné avec CACHE "stock-conso-v2" dans sw-stock.js */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw-stock.js").catch(function(e){ console.error("SW", e); });
  });
}
var arts = [
 ["Gel hydroalcoolique",12,5],["Savon",8,4],["Gants jetables",3,5],["Masques",40,20],["Charlottes",25,10],
 ["Poches poubelle",6,10],["Scotch",9,3],["Agrafeuses",4,2],["Agrafes",10,3],["Stylos",30,10],
 ["Marqueurs",2,5],["Feuilles",15,5],["Balais",4,2],["Pelles",3,2],["Produit de nettoyage",7,3]
].map(function(a,i){return {id:i,nom:a[0],stock:a[1],seuil:a[2]};});
var cur=null, sens=1, qv=1, code="";
var SVG_MOINS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></svg>';
var SVG_PLUS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var SVG_SUPPR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

function $(i){return document.getElementById(i);}
function etat(a){return a.stock<a.seuil?'bas':'';}
function vue(v){
  var l=document.querySelectorAll('.vue');for(var i=0;i<l.length;i++)l[i].classList.remove('on');$(v).classList.add('on');
  var accueil=v==='vStock';
  $('back').style.display=accueil?'none':'flex';$('logo').style.display=accueil?'flex':'none';
  $('titre').textContent=v==='vInv'?'Inventaire du lundi':(v==='vAdm'?'Administration':'Petits consommables');
  $('stitre').textContent=v==='vInv'?'Comptage du stock réel':(v==='vAdm'?'Articles et seuils':'Stock central — zone expédition');
  window.scrollTo(0,0); if(accueil)rendre();
}
function fermer(o){$(o).classList.remove('on');}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},2400);}

function rendre(){
  var h='';
  arts.slice().sort(function(x,y){var o={bas:0,'':1};return o[etat(x)]-o[etat(y)]||x.nom.localeCompare(y.nom);})
  .forEach(function(a){
    var e=etat(a), pct=Math.min(100,Math.round(a.stock/(a.seuil*3)*100));
    var sub=e==='bas'?'Sous le seuil ('+a.seuil+')':'Seuil : '+a.seuil;
    h+='<div class="art '+e+'"><div class="info"><div class="nom">'+a.nom+'</div><div class="jauge"><i style="width:'+pct+'%"></i></div><div class="sub">'+sub+'</div></div>'+
       '<div class="stk">'+a.stock+'</div>'+
       '<div class="mvs"><button class="mv moins" onclick="mv('+a.id+',-1)">'+SVG_MOINS+'</button><button class="mv plus" onclick="mv('+a.id+',1)">'+SVG_PLUS+'</button></div></div>';
  });
  $('liste').innerHTML=h;
}
function mv(id,s){cur=arts[id];sens=s;qv=1;
  $('mvTag').textContent=s<0?'Sortie':'Entrée';$('mvTag').className='tag '+(s<0?'s':'e');
  $('mvTitre').textContent=cur.nom;$('mvSous').textContent='Stock actuel : '+cur.stock;
  $('mvOk').style.background=s<0?'#DC2626':'#16a34a';$('mvOk').textContent=s<0?'Valider la sortie':'Valider l\'entrée';
  maj();$('ovMv').classList.add('on');}
function borne(){qv=Math.max(1,qv);if(sens<0)qv=Math.min(qv,Math.max(1,cur.stock));}
function q(d){qv+=d;borne();maj();}
function maj(){$('mvQ').textContent=qv;var ap=Math.max(0,cur.stock+sens*qv);
  $('mvApres').innerHTML='Stock après validation : <b>'+ap+'</b>'+(ap<cur.seuil?' — <span style="color:#DC2626;font-weight:600">sous le seuil</span>':'');}
function validerMv(){var avant=cur.stock;cur.stock=Math.max(0,cur.stock+sens*qv);fermer('ovMv');rendre();
  if(avant>=cur.seuil&&cur.stock<cur.seuil)toast('Sous le seuil : alerte mail à Myriam');else toast((sens<0?'Sortie':'Entrée')+' enregistrée');}

function ouvrirInv(){var h='';arts.slice().sort(function(x,y){return x.nom.localeCompare(y.nom);}).forEach(function(a){
  h+='<div class="art"><div class="info"><div class="nom">'+a.nom+'</div><div class="sub">Stock théorique : '+a.stock+'</div></div><div class="ecart" id="e'+a.id+'"></div><input type="number" inputmode="numeric" id="i'+a.id+'" placeholder="'+a.stock+'" oninput="ec('+a.id+')"></div>';});
  $('listeInv').innerHTML=h;vue('vInv');}
function ec(id){var v=$('i'+id).value,e=$('e'+id);if(v===''){e.textContent='';return;}var d=Number(v)-arts[id].stock;e.textContent=(d>0?'+':'')+d;e.style.color=d<0?'#DC2626':(d>0?'#16a34a':'#6B7280');}
function validerInv(){var n=0;arts.forEach(function(a){var v=$('i'+a.id).value;if(v!==''){a.stock=Number(v);n++;}});vue('vStock');toast('Inventaire validé — récap envoyé à Myriam');}

function ouvrirCode(){code='';points();var h='';['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){h+=k?'<button onclick="tap(\''+k+'\')">'+k+'</button>':'<span></span>';});$('pad').innerHTML=h;$('ovCode').classList.add('on');}
function points(){var l=$('codeAff').children;for(var i=0;i<4;i++)l[i].className=i<code.length?'on':'';}
function tap(k){if(k==='⌫')code=code.slice(0,-1);else if(code.length<4)code+=k;points();
  if(code.length===4){setTimeout(function(){fermer('ovCode');ouvrirAdm();},150);}}
function ouvrirAdm(){var h='';arts.slice().sort(function(x,y){return x.nom.localeCompare(y.nom);}).forEach(function(a){
  h+='<div class="art"><div class="info"><div class="nom">'+a.nom+'</div><div class="sub">Stock : '+a.stock+'</div></div><div><div class="lbl">Seuil</div><input type="number" inputmode="numeric" value="'+a.seuil+'" onchange="arts['+a.id+'].seuil=Number(this.value)||0"></div><button class="suppr" onclick="toast(\'Suppression avec confirmation (maquette)\')">'+SVG_SUPPR+'</button></div>';});
  $('listeAdm').innerHTML=h;vue('vAdm');}
rendre();
</script>
</body>
</html>
